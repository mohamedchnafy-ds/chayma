<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Chayma Dahmani</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-brain logo-icon"></i>
                Chayma Dahmani
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html#accueil">ACCUEIL</a></li>
                    <li class="nav-item"><a class="nav-link" href="../index.html#apropos">À PROPOS</a></li>
                    <li class="nav-item"><a class="nav-link" href="../index.html#approche">MON APPROCHE</a></li>
                    <li class="nav-item"><a class="nav-link" href="../index.html#blog">BLOG</a></li>
                    <li class="nav-item"><a class="nav-link" href="../index.html#contact">CONTACT</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Article Content -->
    <section class="blog-article section-padding">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <article>
                        <div class="article-meta">
                            <span><i class="fas fa-calendar"></i> {{date}}</span>
                            <span><i class="fas fa-tag"></i> {{category}}</span>
                        </div>
                        <img src="{{image}}" alt="{{title}}" class="img-fluid rounded mb-4">
                        {{content}}
                    </article>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
